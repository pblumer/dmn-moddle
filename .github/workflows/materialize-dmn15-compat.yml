name: Materialize DMN 1.5 compatibility descriptor

on:
  push:
    branches:
      - feature/dmn-1.5-compatibility-suite

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip materialize]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate descriptors
        run: npm run generate-schema

      - name: Commit generated descriptor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/dmn/json/dmn15.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: materialize DMN 1.5 descriptor [skip materialize]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
